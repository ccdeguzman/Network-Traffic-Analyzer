[project]
name = "netanal"
version = "0.1.0"
description = "Network traffic capture and analysis CLI"
requires-python = ">=3.9"
dependencies = [
        "scapy>=2.5",
        "click>=8.1",
        "rich>=13.0",
]

[project.scripts]
netanal = "netanal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netanal"]
